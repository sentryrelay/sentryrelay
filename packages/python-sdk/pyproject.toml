[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentryrelay-sdk"
version = "0.2.0"
description = "Official Python SDK for Sentry Relay — The 2FA, OTP & Magic-Link Inbox API for Autonomous Software"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Sentry Relay Team", email = "engineering@sentryrelay.com" }
]
keywords = [
    "sentryrelay",
    "2fa",
    "otp",
    "totp",
    "magic-link",
    "browser-use",
    "playwright",
    "langgraph",
    "crewai",
    "google-adk",
    "microsoft-agents",
    "pydantic-ai",
    "openai-agents",
    "claude-agent-sdk",
    "strands",
    "agno",
    "smolagents",
    "ai-agents",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
crewai = [
    "crewai>=0.1.0",
]
google-adk = [
    "google-adk>=0.1.0",
]
microsoft-agents = [
    "agent-framework>=0.1.0",
]
pydantic-ai = [
    "pydantic-ai>=0.0.1",
]
openai-agents = [
    "openai-agents>=0.1.0",
]
claude-agent = [
    "claude-agent-sdk>=0.1.0",
]
strands = [
    "strands-agents>=0.1.0",
]
agno = [
    "agno>=1.0.0",
]
smolagents = [
    "smolagents>=1.0.0",
]

[project.urls]
Homepage = "https://sentryrelay.com"
Documentation = "https://sentryrelay.com/docs"
Repository = "https://github.com/sentryrelay/sentryrelay"

[tool.hatch.build.targets.wheel]
packages = ["src/sentryrelay"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
